  <title id="t">Iceberg: la ciencia visible y la ciencia invisible</title>
  <desc id="d">Arriba de la línea de agua, una punta pequeña con la palabra Descubrimientos. Debajo del agua, una masa mucho más grande con las palabras Evaluación, Gestión, Datos y Software.</desc>
  <rect width="800" height="500" fill="#e8f3f3"/>
