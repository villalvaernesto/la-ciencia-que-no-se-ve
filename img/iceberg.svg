  <rect y="186" width="800" height="6" fill="#ffffff"/>
  <polygon points="400,40 470,186 330,186" fill="#ffffff" stroke="#12263a" stroke-width="3"/>
  <polygon points="250,192 550,192 500,350 400,440 300,350" fill="#0e7c7b" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="165" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#12263a" text-anchor="middle">Descubrimientos</text>
  <text x="400" y="240" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluación</text>
  <text x="400" y="285" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Gestión</text>
  <text x="400" y="330" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Datos y software</text>
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="20" fill="#12263a">Lo que se ve</text>
  <text x="60" y="470" font-family="Segoe UI, sans-serif" font-size="20" fill="#ffffff">Lo que no se ve</text>
