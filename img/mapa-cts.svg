<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Mapa conceptual CTS del caso</title>
  <desc id="d">Al centro, el nodo IA en la gestión del CONICET. Unido a él hay cuatro grupos: Actores, Tecnologías, Impactos y Conceptos CTS.</desc>
  <rect width="800" height="460" fill="#f3f6f9"/>
  <g stroke="#12263a" stroke-width="3">
    <line x1="400" y1="230" x2="150" y2="90"/><line x1="400" y1="230" x2="650" y2="90"/>
    <line x1="400" y1="230" x2="150" y2="370"/><line x1="400" y1="230" x2="650" y2="370"/>
  </g>
  <ellipse cx="400" cy="230" rx="140" ry="62" fill="#12263a"/>
  <g font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="400" y="224" fill="#ffffff">IA en la gestión</text><text x="400" y="248" fill="#ffffff">del CONICET</text>
    <rect x="60" y="55" width="180" height="70" rx="12" fill="#0b4f8a"/><text x="150" y="97" fill="#ffffff">Actores</text>
    <rect x="560" y="55" width="180" height="70" rx="12" fill="#0e7c7b"/><text x="650" y="97" fill="#ffffff">Tecnologías</text>
    <rect x="60" y="335" width="180" height="70" rx="12" fill="#0e7c7b"/><text x="150" y="377" fill="#ffffff">Impactos</text>
    <rect x="560" y="335" width="180" height="70" rx="12" fill="#0b4f8a"/><text x="650" y="377" fill="#ffffff">Conceptos CTS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
