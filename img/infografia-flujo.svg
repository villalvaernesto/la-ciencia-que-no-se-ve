<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Cómo funciona el sistema de recomendación en cinco pasos</title>
  <desc id="d">Cinco cuadros conectados por flechas: uno, datos de la postulación; dos, búsqueda general de afinidad; tres, refinamiento con un modelo de lenguaje; cuatro, exclusión por conflicto de interés; cinco, lista preseleccionada para la comisión.</desc>
  <defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12263a"/></marker></defs>
  <rect width="1000" height="230" fill="#f3f6f9"/>
  <g font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="10" y="50" width="160" height="130" rx="12" fill="#0b4f8a"/>
    <rect x="212" y="50" width="160" height="130" rx="12" fill="#0e7c7b"/>
    <rect x="414" y="50" width="160" height="130" rx="12" fill="#0b4f8a"/>
    <rect x="616" y="50" width="160" height="130" rx="12" fill="#0e7c7b"/>
    <rect x="818" y="50" width="172" height="130" rx="12" fill="#12263a"/>
    <text x="90" y="95" font-size="30">1</text><text x="90" y="128">Datos de la</text><text x="90" y="150">postulación</text>
    <text x="292" y="95" font-size="30">2</text><text x="292" y="128">Búsqueda general</text><text x="292" y="150">de afinidad</text>
    <text x="494" y="95" font-size="30">3</text><text x="494" y="128">Refinamiento con</text><text x="494" y="150">modelo de lenguaje</text>
    <text x="696" y="95" font-size="30">4</text><text x="696" y="128">Exclusión por</text><text x="696" y="150">conflicto de interés</text>
    <text x="904" y="95" font-size="30">5</text><text x="904" y="128">Lista para la</text><text x="904" y="150">comisión</text>
  </g>
  <g stroke="#12263a" stroke-width="3" marker-end="url(#f)">
    <line x1="172" y1="115" x2="208" y2="115"/><line x1="374" y1="115" x2="410" y2="115"/>
    <line x1="576" y1="115" x2="612" y2="115"/><line x1="778" y1="115" x2="814" y2="115"/>
  </g>
